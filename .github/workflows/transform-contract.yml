# The transformation contract: every transform() must be importable, and none may
# assert a control is satisfied from a body that proves nothing.
#
# WHY THIS GATE EXISTS. Measured 2026-09-21 across 802 loadable transforms: 120
# asserted a satisfaction-style criterion true for an empty or authentication-error
# body, and 18 did so for null -- among them "backups are encrypted", "MFA is
# enforced for users" and "endpoint protection is configured", each answered from a
# response that was never read. One file of 803 could not be imported at all, so
# whatever wired it received an import error instead of a verdict.
#
# It needs no credentials and makes no network call: it imports each transform and
# hands it bodies that contain no evidence.
name: transform-contract

# RUNS ON TRUNK AS WELL AS ON PULL REQUESTS, because a quarter of what lands on
# develop never went through one. Measured 2026-09-22 on origin/develop: of its 103
# first-parent commits, 27 are NOT merge commits -- they were pushed straight to the
# branch. The most recent is 8bf278fb (2026-09-04), and among the others are
# `fix: huntress transformations`, `fix: tenable transformations`, `Netskope` and
# `Mimecast changes` -- four of the files that were in the 124 this gate found. main
# has them too (faccedc7, 43fdf34a, both 2026-08-20). A pull_request-only gate would
# not have run on any of them.
#
# PUSH IS RESTRICTED TO THE THREE LONG-LIVED BRANCHES, and that restriction is the
# whole design rather than a tidiness choice. `on: [push, pull_request]` unrestricted
# fires BOTH events for a push to a branch that has an open pull request, so every sha
# gets two identical runs; spektrum-platform measured exactly that on its PR #153 (two
# runs three seconds apart on one sha, and `gh pr checks` reporting eight rows for four
# logical checks). Naming only develop/staging/main here means a feature branch is
# covered by pull_request alone and trunk by push alone, so there is one run per sha.
#
# AND NOT A JOB-LEVEL `if:`, which is the other obvious way to write this: a skipped
# job still creates a check run, and GitHub counts a skipped check as SUCCESS for a
# required status check. That rebuilds the hollow gate out of skips. Filtering at the
# trigger means the redundant run is never created.
#
# The push/pull_request baseline difference that matters for a diff-based checker does
# not arise here: these contracts judge the whole tree rather than a diff, so both
# events ask the same question and the two runs could not disagree.
on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main]

permissions:
  contents: read

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The checker's own self-test runs FIRST and is fatal. It plants three
      # transforms and proves the checker catches a `data is not None` default,
      # clears a correct fail-closed transform, and clears an INVERTED key (one
      # whose true denotes the insecure condition). A checker that has quietly
      # stopped catching anything would otherwise report a clean tree forever,
      # which is the same failure this gate exists to prevent, one level up.
      - name: Checker self-test
        run: python tools/check_fail_closed.py --self-test

      # Fails when a transform NOT on contracts/fail-closed-allowlist.json returns any
      # key true (an INVERTED key false) from {}, an auth-error envelope, null or
      # "{}" -- or when any transform cannot be imported. Listed files are reported
      # and do not fail the run; the list may only shrink, and entries that no
      # longer reproduce are reported STALE so the ratchet keeps moving.
      - name: No transform may answer from a body that proves nothing
        run: python tools/check_fail_closed.py

      # The second contract, and a genuinely different question. A transform hard-wired
      # to `true` passes the gate above, because it answers the same way from
      # everything; only this one asks whether ANY input makes it say no. Its self-test
      # runs first for the same reason as the other's.
      - name: Discrimination checker self-test
        run: python tools/check_discriminates.py --self-test

      - name: No criterion may be incapable of reporting a failure
        run: python tools/check_discriminates.py

      # The third contract. Production does not import these files: it compiles each
      # one with RestrictedPython, which rejects names starting with "_", `x["k"] += 1`
      # and `nonlocal` -- all of which plain Python (and so every step above) accepts.
      # On 2026-09-22 a sweep added `_affirmative_signal` to 73 files and 80 live
      # transforms stopped compiling in production while every gate here stayed green.
      # Same job, not a new one, so no new required-check name is created.
      - name: Install sandbox dependency
        run: pip install "RestrictedPython>=8.0,<9.0"

      - name: Sandbox-compile checker self-test
        run: python tools/check_sandbox_compile.py --self-test

      - name: Every transform must compile in the production sandbox
        run: python tools/check_sandbox_compile.py

  # WHY THIS JOB WAS ADDED. Measured 2026-09-22 on this branch: the repo contains
  # 9 pytest files holding 71 tests, and no workflow here ran a single one of them
  # -- `grep -rn "pytest\|unittest" .github/workflows/` returned nothing. All 71
  # passed the moment they were run, so nothing was broken; what was broken was
  # the belief that they were being checked. A suite that has never run and a gate
  # that cannot fail are the same defect, which is why this job lives in this file
  # rather than a new one. (A new workflow would also mean a new required status
  # check, i.e. a branch-protection change, which is not this change's to make.)
  #
  # It inherits the `pull_request`-only trigger at the top of this file, and like
  # the checks above it needs no credentials and makes no network call.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pytest and pydantic, and measurably nothing else -- see the comments in
      # requirements-test.txt for why each bound is where it is.
      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      # Self-test first and fatal, for the same reason as the checkers above: the
      # guard here is a count, and a counting guard that has stopped counting
      # looks exactly like a suite that is passing. This proves the floor logic
      # still rejects a short count, an all-skipped run, and a collection error.
      - name: Test-floor checker self-test
        run: python tools/check_test_floor.py --self-test

      # Runs `pytest safeguards/` from the repo root -- measured 2026-09-22, that
      # single invocation collects all 71 tests across all 9 files, including the
      # 5 sonicwall ones that `from conftest import ...`, so no per-directory
      # invocation is needed. The wrapper then fails the job if fewer than 71
      # tests were collected, if any were skipped, or if anything errored during
      # collection -- all three of which a bare `pytest` step reports as exit 0.
      - name: Transformation unit tests, and the suite may not shrink
        run: python tools/check_test_floor.py
